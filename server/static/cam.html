<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PokerVis Camera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui/vendor/style.css">
<link rel="stylesheet" href="/ui/live.css">
</head>
<body>
<header><h1>POKER<span>VIS</span></h1></header>
<main class="page">
<section class="panel">
  <h2>TABLE CAMERA</h2>
  <p class="hint">Fix this phone about 1 m above the table, looking straight down. Lock the screen rotation and keep the screen on.</p>
  <div id="login"><input id="pin" class="field" inputmode="numeric" placeholder="DEALER PIN"><button id="go" class="go wide" type="button">START CAMERA</button></div>
  <video id="v" autoplay playsinline muted hidden></video>
  <p id="msg" class="hint"></p>
</section>
</main>
<script>
const $ = id => document.getElementById(id); let sent = 0;
const FRAME_MS = 250, MAX_SIDE = 1920, QUALITY = 0.8;      // 4 fps; the next frame leaves only when the last one has landed
const ROOM = new URLSearchParams(location.search).get("room") || "";
let token = (location.hash.match(/[#&]t=([^&]+)/) || [])[1] || null;
if (token) { $("pin").hidden = true; }
const sleep = ms => new Promise(r => setTimeout(r, ms));
// Ask for the back camera at high resolution, but never fail just because a phone cannot match every preference.
async function getCamera() {
  try {
    return await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } }, audio: false });
  } catch (e) {
    if (e && e.name === "NotAllowedError") throw new Error("Camera permission was denied. Allow camera access for this site in your browser settings, then reload this page.");
    return await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
  }
}
async function start() {
  if (!window.isSecureContext) { $("msg").innerHTML = '<span class="bad">Camera access needs HTTPS.</span> Open this page through the https tunnel link (cloudflared) instead of the http LAN address.'; return; }
  try {
    if (!token) {
      const r = await fetch("/api/dealer/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: $("pin").value }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.detail); token = j.token;
    }
    const stream = await getCamera();
    const v = $("v"); v.srcObject = stream; v.hidden = false; $("login").hidden = true;
    const wake = async () => { try { await navigator.wakeLock.request("screen"); } catch {} };
    await wake();
    const track = stream.getVideoTracks()[0];
    track.onended = () => { $("msg").innerHTML = '<span class="bad">Camera stopped (screen locked or app switched). Reload this page and start again.</span>'; };
    document.addEventListener("visibilitychange", () => {          // coming back to the page: keep the screen awake, restart if the camera died
      if (document.visibilityState === "visible") { wake(); if (track.readyState === "ended") location.reload(); }
    });
    const c = document.createElement("canvas");
    for (;;) {
      const t0 = performance.now();
      if (v.videoWidth) {
        try {
          const s = Math.min(1, MAX_SIDE / Math.max(v.videoWidth, v.videoHeight)), w = Math.round(v.videoWidth * s), h = Math.round(v.videoHeight * s);
          c.width = w; c.height = h; c.getContext("2d").drawImage(v, 0, 0, w, h);
          const blob = await new Promise(res => c.toBlob(res, "image/jpeg", QUALITY));
          const r = await fetch("/api/cam/frame", { method: "POST", headers: { Authorization: "Bearer " + token, "Content-Type": "image/jpeg" }, body: blob });
          if (r.status === 404 || r.status === 401) { $("msg").innerHTML = '<span class="bad">This table has closed.</span>'; stream.getTracks().forEach(x => x.stop()); return; }
          if (!r.ok) throw new Error("upload " + r.status);
          sent++; $("msg").innerHTML = `<span class="ok">Streaming</span> · ${sent} frames sent · ${(blob.size / 1024).toFixed(0)} KB/frame · ${w}×${h}`;
        } catch (e) { $("msg").innerHTML = `<span class="bad">${e.message}</span>`; await sleep(500); }
      }
      await sleep(Math.max(10, FRAME_MS - (performance.now() - t0)));
    }
  } catch (e) { $("msg").innerHTML = `<span class="bad">${e.message}</span>`; }
}
$("go").onclick = start;
</script>
</body>
</html>
