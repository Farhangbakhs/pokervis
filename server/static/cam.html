<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AutoPoker Dealer Cam</title>
<style>
  :root { --bg:#0b1511; --ink:#eaf2ec; --dim:#8fa597; --ok:#3ddc84; --bad:#ff6b6b; }
  * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,sans-serif; padding:14px; }
  video { width:100%; border-radius:10px; background:#000; } input,button { font:inherit; padding:14px; border-radius:10px; border:0; width:100%; margin-top:8px; }
  input { border:1px solid #27402f; background:transparent; color:var(--ink); } button { background:#1f7a4a; color:#fff; font-weight:700; }
  .dim { color:var(--dim); } .bad { color:var(--bad); } .ok { color:var(--ok); }
</style>
</head>
<body>
<h3>Dealer camera</h3>
<p class="dim">Mount this phone about 1 m above the table, pointing straight down. Lock the screen rotation and keep the screen on.</p>
<div id="login"><input id="pin" inputmode="numeric" placeholder="Dealer PIN"><button id="go">Start camera</button></div>
<video id="v" autoplay playsinline muted hidden></video>
<p id="msg" class="dim"></p>
<script>
const $ = id => document.getElementById(id); let token = null, sent = 0, busy = false;
// Ask for the back camera at high resolution, but never fail just because a phone cannot match every preference.
async function getCamera() {
  try {
    return await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } }, audio: false });
  } catch (e) {
    if (e && e.name === "NotAllowedError") throw new Error("Camera permission was denied. Allow camera access for this site in your browser settings, then reload this page.");
    return await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
  }
}
async function start() {
  if (!window.isSecureContext) { $("msg").innerHTML = '<span class="bad">Camera access needs HTTPS.</span> Open this page through the https tunnel link (cloudflared) instead of the http LAN address.'; return; }
  try {
    const r = await fetch("/api/dealer/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: $("pin").value }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.detail); token = j.token;
    const stream = await getCamera();
    const v = $("v"); v.srcObject = stream; v.hidden = false; $("login").hidden = true;
    const wake = async () => { try { await navigator.wakeLock.request("screen"); } catch {} };
    await wake();
    const track = stream.getVideoTracks()[0];
    track.onended = () => { $("msg").innerHTML = '<span class="bad">Camera stopped (screen locked or app switched). Reload this page and start again.</span>'; };
    document.addEventListener("visibilitychange", () => {          // coming back to the page: keep the screen awake, restart if the camera died
      if (document.visibilityState === "visible") { wake(); if (track.readyState === "ended") location.reload(); }
    });
    // One frame every 500 ms (the rate the card reader's motion check is tuned for), at the camera's native
    // resolution and near-lossless JPEG: the reader must get the sharpest possible card corners.
    const c = document.createElement("canvas");
    setInterval(async () => {
      if (busy || !v.videoWidth) return; busy = true;
      try { const w = v.videoWidth, h = v.videoHeight; c.width = w; c.height = h; c.getContext("2d").drawImage(v, 0, 0, w, h);
        const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.95));
        const r = await fetch("/api/cam/frame", { method: "POST", headers: { Authorization: "Bearer " + token, "Content-Type": "image/jpeg" }, body: blob });
        if (!r.ok) throw new Error("upload " + r.status); sent++; $("msg").innerHTML = `<span class="ok">Streaming</span> · ${sent} frames sent · ${(blob.size / 1024).toFixed(0)} KB/frame · ${w}×${h}`; }
      catch (e) { $("msg").innerHTML = `<span class="bad">${e.message}</span>`; } finally { busy = false; }
    }, 500);
  } catch (e) { $("msg").innerHTML = `<span class="bad">${e.message}</span>`; }
}
$("go").onclick = start;
</script>
</body>
</html>
